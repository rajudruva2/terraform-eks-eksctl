apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: dev-eks
  region: ap-south-1
  version: "1.33"

managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 20

iam:
  withOIDC: true

cloudWatch:
  clusterLogging:
    enableTypes: ["*"]
