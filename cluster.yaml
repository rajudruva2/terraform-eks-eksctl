apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: dev-eks
  region: us-east-1
  version: "1.33"

managedNodeGroups:
  - name: workers
    instanceType: t3.large
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 40

iam:
  withOIDC: true

cloudWatch:
  clusterLogging:
    enableTypes: ["*"]
